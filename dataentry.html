<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICF-SL · Data Entry</title>
    <style>
        /* ----- reset & base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #1a1a1a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ----- header – navy blue ----- */
        .header {
            background-color: #1a2a4a;
            color: white;
            padding: 1.5rem 2rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.2rem;
        }

        .header-title {
            font-weight: 500;
            font-size: 1.9rem;
            letter-spacing: -0.2px;
            line-height: 1.2;
        }

        .header-subtitle {
            font-weight: 300;
            font-size: 1.1rem;
            opacity: 0.85;
            letter-spacing: 0.4px;
            margin-top: 0.1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 0.4rem;
            width: 100%;
        }

        /* navigation breadcrumb */
        .nav-breadcrumb {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 0.8rem 2rem 0;
            font-size: 0.85rem;
            color: #6a7b8c;
        }

        .nav-breadcrumb a {
            color: #1a2a4a;
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .nav-breadcrumb a:hover {
            opacity: 1;
        }

        .nav-breadcrumb span {
            opacity: 0.4;
            margin: 0 0.3rem;
        }

        .nav-breadcrumb .current {
            opacity: 0.6;
            font-weight: 500;
        }

        /* ----- main content – plain white body, two cards ----- */
        .main-content {
            flex: 1 0 auto;
            background-color: #ffffff;
            padding: 1.5rem 2rem 2.5rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* page title */
        .page-title {
            font-size: 1.5rem;
            font-weight: 400;
            color: #1a2a4a;
            margin-bottom: 1.8rem;
            letter-spacing: -0.2px;
        }

        .page-title span {
            opacity: 0.5;
            font-weight: 300;
        }

        /* card grid – two cards side by side */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.8rem;
            align-items: stretch;
        }

        /* each card – navy blue */
        .card {
            background: #1a2a4a;
            border-radius: 20px;
            border: 1px solid #2c3f5e;
            box-shadow: 0 6px 20px rgba(26, 42, 74, 0.15);
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            color: #ffffff;
            text-decoration: none;
            cursor: pointer;
            min-height: 200px;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(26, 42, 74, 0.3);
        }

        .card .icon {
            font-size: 3.5rem;
            line-height: 1;
            margin-bottom: 0.8rem;
        }

        .card h2 {
            font-weight: 500;
            font-size: 1.8rem;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .card .sub-text {
            font-weight: 300;
            font-size: 0.85rem;
            opacity: 0.5;
            margin-top: 0.3rem;
        }

        /* responsive – stack cards on smaller screens */
        @media (max-width: 820px) {
            .cards-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .main-content {
                padding: 1rem 1.2rem 1.8rem;
            }
            .card {
                padding: 2.5rem 1.5rem;
                min-height: 160px;
            }
            .card .icon {
                font-size: 2.8rem;
            }
            .card h2 {
                font-size: 1.5rem;
            }
            .nav-breadcrumb {
                padding: 0.6rem 1.2rem 0;
                font-size: 0.8rem;
            }
            .page-title {
                font-size: 1.2rem;
                margin-bottom: 1.2rem;
            }
        }

        @media (max-width: 420px) {
            .header-title {
                font-size: 1.2rem;
            }
            .header-subtitle {
                font-size: 0.8rem;
            }
            .card {
                padding: 2rem 1.2rem;
                min-height: 130px;
            }
            .card .icon {
                font-size: 2.2rem;
            }
            .card h2 {
                font-size: 1.2rem;
            }
        }

        /* ----- footer – navy blue ----- */
        .footer {
            background-color: #1a2a4a;
            color: white;
            padding: 1.2rem 2rem;
            margin-top: auto;
            flex-shrink: 0;
            border-top: 1px solid #2c3f5e;
        }

        .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .footer-inner span {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .header {
                padding: 1rem 1.2rem;
            }
            .header-title {
                font-size: 1.4rem;
                line-height: 1.2;
            }
            .header-subtitle {
                font-size: 0.95rem;
                padding-top: 0.3rem;
            }
            .footer {
                padding: 0.9rem 1rem;
            }
            .footer-inner {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-inner">
            <div class="header-title">INFORMATICS CONSULTANCY FIRM SIERRA LEONE</div>
            <div class="header-subtitle">Financial Management System</div>
        </div>
    </header>

    <!-- BREADCRUMB NAVIGATION -->
    <div class="nav-breadcrumb">
        <a href="landing.html">🏠 Home</a>
        <span>›</span>
        <span class="current">Data Entry</span>
    </div>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="page-title">
            Data Entry <span>· Select entry type</span>
        </div>

        <div class="cards-grid">

            <!-- CARD 1: INCOME → links to income.html -->
            <a href="income.html" class="card">
                <span class="icon">💰</span>
                <h2>Income</h2>
                <span class="sub-text">Record incoming funds</span>
            </a>

            <!-- CARD 2: EXPENSES → links to expen.html -->
            <a href="expen.html" class="card">
                <span class="icon">💳</span>
                <h2>Expenses</h2>
                <span class="sub-text">Record outgoing payments</span>
            </a>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-inner">
            <span>ICF-SL © 2026  ·  FinanceManager</span>
        </div>
    </footer>

</body>
</html>
